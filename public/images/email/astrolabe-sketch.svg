<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Sacred Vedic Gold Gradients -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996f16" />
      <stop offset="25%" stop-color="#c59b27" />
      <stop offset="50%" stop-color="#e8c85a" />
      <stop offset="75%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#7a1422" />
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b08218" />
      <stop offset="50%" stop-color="#f3d46f" />
      <stop offset="100%" stop-color="#8c1b2a" />
    </linearGradient>

    <radialGradient id="sacredHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#c59b27" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Central Warm Astrological Aura -->
  <circle cx="300" cy="300" r="290" fill="url(#sacredHalo)" />

  <!-- ==================== OUTER ASTROLABE RIMS ==================== -->
  <!-- Outer Bezel Ring -->
  <circle cx="300" cy="300" r="288" fill="none" stroke="url(#goldMain)" stroke-width="3.5" />
  <circle cx="300" cy="300" r="282" fill="none" stroke="url(#goldMain)" stroke-width="1.5" />
  
  <!-- Outer Degree Track Ring -->
  <circle cx="300" cy="300" r="268" fill="none" stroke="url(#goldMain)" stroke-width="2" />
  <circle cx="300" cy="300" r="264" fill="none" stroke="url(#goldMain)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- 36 Degree Graduation Ticks (Astrolabe Degree Scale) -->
  <g stroke="url(#goldMain)" stroke-width="2">
    <!-- Major Cardinal Ticks (12 Ticks) -->
    <line x1="300" y1="12" x2="300" y2="36" stroke-width="3" />
    <line x1="300" y1="564" x2="300" y2="588" stroke-width="3" />
    <line x1="12" y1="300" x2="36" y2="300" stroke-width="3" />
    <line x1="564" y1="300" x2="588" y2="300" stroke-width="3" />
    <line x1="96" y1="96" x2="114" y2="114" stroke-width="2.5" />
    <line x1="486" y1="486" x2="504" y2="504" stroke-width="2.5" />
    <line x1="96" y1="504" x2="114" y2="486" stroke-width="2.5" />
    <line x1="486" y1="114" x2="504" y2="96" stroke-width="2.5" />
    <line x1="444" y1="50" x2="433" y2="69" stroke-width="2" />
    <line x1="156" y1="550" x2="167" y2="531" stroke-width="2" />
    <line x1="50" y1="444" x2="69" y2="433" stroke-width="2" />
    <line x1="550" y1="156" x2="531" y2="167" stroke-width="2" />
    <line x1="550" y1="444" x2="531" y2="433" stroke-width="2" />
    <line x1="50" y1="156" x2="69" y2="167" stroke-width="2" />
    <line x1="444" y1="550" x2="433" y2="531" stroke-width="2" />
    <line x1="156" y1="50" x2="167" y2="69" stroke-width="2" />
  </g>

  <!-- Fine Degree Ticks (36 Intermediate Ticks) -->
  <g stroke="url(#goldMain)" stroke-width="1.2" opacity="0.85">
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(10 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(20 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(40 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(50 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(70 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(80 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(100 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(110 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(130 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(140 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(160 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(170 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(190 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(200 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(220 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(230 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(250 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(260 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(280 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(290 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(310 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(320 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(340 300 300)" />
    <line x1="300" y1="20" x2="300" y2="32" transform="rotate(350 300 300)" />
  </g>

  <!-- ==================== ZODIAC RASHI WHEEL TRACK ==================== -->
  <!-- Zodiac Outer Border -->
  <circle cx="300" cy="300" r="256" fill="none" stroke="url(#goldMain)" stroke-width="2.5" />
  <!-- Zodiac Inner Border -->
  <circle cx="300" cy="300" r="214" fill="none" stroke="url(#goldMain)" stroke-width="2.5" />
  <circle cx="300" cy="300" r="208" fill="none" stroke="url(#goldMain)" stroke-width="1" stroke-dasharray="3 4" />

