    <line x1="300" y1="44" x2="300" y2="86" />
    <line x1="300" y1="514" x2="300" y2="556" />
    <line x1="44" y1="300" x2="86" y2="300" />
    <line x1="514" y1="300" x2="556" y2="300" />
    <line x1="428" y1="78" x2="399" y2="128" />
    <line x1="172" y1="522" x2="201" y2="472" />
    <line x1="78" y1="428" x2="128" y2="399" />
    <line x1="522" y1="172" x2="472" y2="201" />
    <line x1="522" y1="428" x2="472" y2="399" />
    <line x1="78" y1="172" x2="128" y2="201" />
    <line x1="428" y1="522" x2="399" y2="472" />
    <line x1="172" y1="78" x2="201" y2="128" />
  </g>

  <!-- 12 Zodiac Rashi Cartouches & Glyphs (Bold & Clearly Visible) -->
  <!-- Circular Badges for Each Glyph -->
  <g fill="#ffffff" fill-opacity="0.8" stroke="url(#goldMain)" stroke-width="1.5">
    <circle cx="300" cy="65" r="16" />
    <circle cx="417" cy="96" r="16" />
    <circle cx="504" cy="183" r="16" />
    <circle cx="535" cy="300" r="16" />
    <circle cx="504" cy="417" r="16" />
    <circle cx="417" cy="504" r="16" />
    <circle cx="300" cy="535" r="16" />
    <circle cx="183" cy="504" r="16" />
    <circle cx="96" cy="417" r="16" />
    <circle cx="65" cy="300" r="16" />
    <circle cx="96" cy="183" r="16" />
    <circle cx="183" cy="96" r="16" />
  </g>

  <!-- The 12 Astrological Zodiac Glyphs (Large & High Contrast) -->
  <g fill="url(#goldBright)" font-family="Georgia, serif" font-size="21" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <!-- Aries ♈ (Mesha) -->
    <text x="300" y="65">♈</text>
    <!-- Taurus ♉ (Vrishabha) -->
    <text x="417" y="96">♉</text>
    <!-- Gemini ♊ (Mithuna) -->
    <text x="504" y="183">♊</text>
    <!-- Cancer ♋ (Karka) -->
    <text x="535" y="300">♋</text>
    <!-- Leo ♌ (Simha) -->
    <text x="504" y="417">♌</text>
    <!-- Virgo ♍ (Kanya) -->
    <text x="417" y="504">♍</text>
    <!-- Libra ♎ (Tula) -->
    <text x="300" y="535">♎</text>
    <!-- Scorpio ♏ (Vrischika) -->
    <text x="183" y="504">♏</text>
    <!-- Sagittarius ♐ (Dhanu) -->
    <text x="96" y="417">♐</text>
    <!-- Capricorn ♑ (Makara) -->
    <text x="65" y="300">♑</text>
    <!-- Aquarius ♒ (Kumbha) -->
    <text x="96" y="183">♒</text>
    <!-- Pisces ♓ (Meena) -->
    <text x="183" y="96">♓</text>
  </g>

  <!-- ==================== SACRED KUNDALI GEOMETRY (OCTAGRAM) ==================== -->
  <!-- Interlocking Squares (Ashta-Dala Sacred Octagram) -->
  <g stroke="url(#goldMain)" stroke-width="2.2" fill="none">
    <!-- Kundali Square 1 -->
    <rect x="165" y="165" width="270" height="270" rx="4" />
    <!-- Kundali Square 2 (Rotated 45°) -->
    <rect x="165" y="165" width="270" height="270" rx="4" transform="rotate(45 300 300)" />
  </g>

  <!-- Secondary Inner Diamond -->
  <g stroke="url(#goldMain)" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.9">
    <rect x="195" y="195" width="210" height="210" rx="2" />
    <rect x="195" y="195" width="210" height="210" rx="2" transform="rotate(45 300 300)" />
  </g>

  <!-- 12 House Diagonal Axis Lines -->
  <g stroke="url(#goldMain)" stroke-width="1.5" opacity="0.75">
    <line x1="165" y1="165" x2="435" y2="435" />
    <line x1="165" y1="435" x2="435" y2="165" />
    <line x1="300" y1="108" x2="300" y2="492" />
    <line x1="108" y1="300" x2="492" y2="300" />
  </g>

  <!-- ==================== NAKSHATRA & LOTUS PETAL MANDALA ==================== -->
  <!-- Lotus Petal Outer Enclosure -->
  <circle cx="300" cy="300" r="162" fill="none" stroke="url(#goldMain)" stroke-width="2.2" />
  <circle cx="300" cy="300" r="148" fill="none" stroke="url(#goldMain)" stroke-width="1.2" stroke-dasharray="3 4" />
  <circle cx="300" cy="300" r="118" fill="none" stroke="url(#goldMain)" stroke-width="2" />

  <!-- 8 Sacred Lotus Petals (Ashta-Padma) -->
  <g stroke="url(#goldMain)" stroke-width="1.8" fill="none">
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" />
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" transform="rotate(45 300 300)" />
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" transform="rotate(90 300 300)" />
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" transform="rotate(135 300 300)" />
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" transform="rotate(180 300 300)" />
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" transform="rotate(225 300 300)" />
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" transform="rotate(270 300 300)" />
    <path d="M 300 138 Q 318 160 300 182 Q 282 160 300 138 Z" transform="rotate(315 300 300)" />
  </g>

  <!-- ==================== CENTRAL SURYA & NAVAGRAHA SUN DISC ==================== -->
  <circle cx="300" cy="300" r="92" fill="none" stroke="url(#goldMain)" stroke-width="2.5" />
  <circle cx="300" cy="300" r="76" fill="none" stroke="url(#goldMain)" stroke-width="1.4" stroke-dasharray="4 3" />
  <circle cx="300" cy="300" r="54" fill="none" stroke="url(#goldMain)" stroke-width="2.2" />

