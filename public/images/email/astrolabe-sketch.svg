  <g stroke="url(#goldMain)" stroke-width="2.4">
    <line x1="300" y1="210" x2="300" y2="242" />
    <line x1="300" y1="358" x2="300" y2="390" />
    <line x1="210" y1="300" x2="242" y2="300" />
    <line x1="358" y1="300" x2="390" y2="300" />
    <line x1="236" y1="236" x2="259" y2="259" />
    <line x1="341" y1="341" x2="364" y2="364" />
    <line x1="236" y1="364" x2="259" y2="341" />
    <line x1="341" y1="259" x2="364" y2="236" />
    <!-- Secondary Intermediate Rays -->
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(22.5 300 300)" stroke-width="1.8" />
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(67.5 300 300)" stroke-width="1.8" />
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(112.5 300 300)" stroke-width="1.8" />
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(157.5 300 300)" stroke-width="1.8" />
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(202.5 300 300)" stroke-width="1.8" />
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(247.5 300 300)" stroke-width="1.8" />
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(292.5 300 300)" stroke-width="1.8" />
    <line x1="300" y1="216" x2="300" y2="238" transform="rotate(337.5 300 300)" stroke-width="1.8" />
  </g>

  <!-- ==================== SACRED OM CORE (PRANAVA) ==================== -->
  <!-- Golden Core Disc -->
  <circle cx="300" cy="300" r="38" fill="#fffdfa" stroke="url(#goldMain)" stroke-width="3" />
  <circle cx="300" cy="300" r="32" fill="none" stroke="url(#goldMain)" stroke-width="1.2" stroke-dasharray="2 3" />
  <!-- Sacred Om Calligraphy -->
  <text x="300" y="307" fill="url(#goldBright)" font-family="Georgia, serif" font-size="34" font-weight="bold" text-anchor="middle" dominant-baseline="central">ॐ</text>

  <!-- Cardinal Star Embellishments -->
  <g fill="url(#goldMain)" font-size="18" text-anchor="middle">
    <text x="300" y="30">✦</text>
    <text x="300" y="582">✦</text>
    <text x="30" y="306">✦</text>
    <text x="572" y="306">✦</text>
  </g>
</svg>
