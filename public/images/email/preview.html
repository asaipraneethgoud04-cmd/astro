      letter-spacing: 0.08em;
      color: #fff;

    .brand-sub {
      font-size: 11px;
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 0.15em;

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .btn-group {

      background: #25080e;
      border: 1px solid #4a0f19;
      border-radius: 8px;
      overflow: hidden;
      padding: 2px;

      color: #d4af37;

      font-weight: 600;

      if (vp === 'mobile') {
        container.classList.add('mobile-mode');
      } else {
        container.classList.remove('mobile-mode');
      }
    }

    function updateActiveBtn(parentId, val) {
      const parent = document.getElementById(parentId);
      const btns = parent.querySelectorAll('button');
      btns.forEach(btn => {
